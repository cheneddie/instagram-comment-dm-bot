name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'security/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Audit root dependency lockfile
        run: npm audit --audit-level=high
      - name: Audit admin dependency lockfile
        run: npm audit --prefix admin --audit-level=high
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
